name: Dev build

# Secret-free debug build for development / hook debugging.
# Produces:
#   - hma-oss-manager-debug (app-debug.apk, install with: adb install -r)
#   - hma-oss-zygisk-debug  (Magisk/KernelSU module zip, flash it and reboot)

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Extra Gradle flags (optional, e.g. --info)'
        required: false
        default: ''
  push:
    branches-ignore:
      - master
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Debug build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # required: settings.gradle.kts reads external/AndroidVMTools/gradle/libs.versions.toml
          submodules: recursive
          # required: versionName/versionCode come from git commit count of origin/master
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare environment
        run: |
          # build.gradle.kts loads local.properties unconditionally
          touch local.properties
          # keep the generated debug keystore in a cacheable location
          mkdir -p ~/.config/.android
          ln -sfn ~/.config/.android ~/.android
          keytool -genkey -v -keystore ~/.config/.android/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.config/.android/debug.keystore
          # NOTE: includes *.gradle.kts, unlike upstream's '**/*.gradle'
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Toolchain info
        run: |
          java -version
          ./gradlew --version

      - name: Gradle prebuild (optional)
        continue-on-error: true
        run: ./gradlew prebuild --stacktrace ${{ github.event.inputs.log_level }}

      - name: Build manager app (debug)
        run: ./gradlew :app:assembleDebug --stacktrace ${{ github.event.inputs.log_level }}

      - name: Build zygisk module (debug)
        run: ./gradlew :zygote:assembleDebug --stacktrace ${{ github.event.inputs.log_level }}

      - name: Show outputs
        if: always()
        run: |
          echo '--- app ---';    ls -lh app/build/outputs/apk/debug/ || true
          echo '--- module ---'; ls -lh zygote/build/outputs/magisk/debug/ || true
          {
            echo '### Built artifacts'
            ls -1 app/build/outputs/apk/debug/*.apk 2>/dev/null || true
            ls -1 zygote/build/outputs/magisk/debug/*.zip 2>/dev/null || true
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload manager APK
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: hma-oss-manager-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload zygisk module
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: hma-oss-zygisk-debug
          path: zygote/build/outputs/magisk/debug/*.zip
          if-no-files-found: error
